disabled_rules:
   - opening_brace
   - identifier_name
   # Predates Swift 5.9 if/switch expressions: it reads the ternary in an
   # implicit-return branch as a statement and flags it, though every one of
   # ours produces a value. Six false positives, no true positives.
   - void_function_in_ternary
cyclomatic_complexity:
  ignores_case_statements: true
excluded:
  - build
  - .claude
line_length:
  warning: 150
